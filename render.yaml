services:
  - type: web
    name: cypherbot
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: python bot.py

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: FREE_DAILY_LIMIT
        value: "10"
